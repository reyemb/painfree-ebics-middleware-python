# painfree — the production shape. Four services, one image, one secret split.
#
# Development needs none of this: `python -m painfree serve` runs against SQLite
# with nothing to provision. This file is what a deployment looks
# like, and the thing it is arranged to make visible is the custody boundary.
#
#   api     serves HTTP.    No PAINFREE_KEY_ENCRYPTION_SECRET, no secret mount.
#   worker  uploads and downloads. Holds it, and is the only service that does.
#
# That is not a convention here: PAINFREE_ROLE=api refuses to start with the
# secret and PAINFREE_ROLE=worker refuses to start without it, so
# moving the secret to the wrong service produces a container that will not
# boot rather than a boundary that quietly moved.
#
# Every secret is a *file* mounted at runtime. Nothing secret is baked into the
# image and nothing secret is written in this file: each `secrets:` entry names
# a path under deploy/secrets/ that `deploy/init-secrets.sh` generates and
# .gitignore excludes. Any PAINFREE_X can be read from a file by setting
# PAINFREE_X_FILE, which is how the URL carrying the database password and the
# custody secret get in without passing through a container's environment.
#
# Written to run under both `docker compose` and `podman-compose`; what it was
# actually verified with is podman.
#
# Everything not secret comes from the .env file beside this one — see
# deploy/production.env.example.

name: painfree

services:

  db:
    # postgres:16.14-alpine, by digest. A tag can be moved; this cannot.
    image: docker.io/library/postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: painfree
      POSTGRES_USER: painfree
      POSTGRES_PASSWORD_FILE: /run/secrets/painfree_db_password
      # Without this, initdb trusts every local connection.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    secrets:
      - painfree_db_password
    volumes:
      # The sealed EBICS keys, the order history, the idempotency ledger and the
      # audit trail. A **bind mount under this directory**, not a named volume,
      # and that is the whole point: `down -v` deletes named volumes, and people
      # run `down -v` to reset a stack. Deleting this one is not "restore from
      # backup" -- with no dump it is new subscriber keys, a re-signed INI
      # letter posted to the bank, and days per connection during which it
      # cannot move money. No compose command can remove a bind mount.
      #
      # The directory ends up owned by a uid inside the container's user
      # namespace, so it is not readable by the operator under rootless podman.
      # Back it up with deploy/snapshot.sh, which runs pg_dump inside the
      # container. A `cp -r` or `tar` of this directory silently skips it.
      - ./state/db:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U painfree -d painfree"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Not published. The database is reachable from the two painfree services
    # and from nowhere else; a backup runs `pg_dump` inside this container.
    expose:
      - "5432"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  api:
    image: ${PAINFREE_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PAINFREE_ROLE: api
      PAINFREE_ENVIRONMENT: production
      PAINFREE_DATABASE_URL_FILE: /run/secrets/painfree_database_url
      PAINFREE_HTTP_PORT: "8000"
      PAINFREE_LOG_LEVEL: ${PAINFREE_LOG_LEVEL:-INFO}
      # One process migrates. The API is the one that does, because it is the
      # one that must not serve a request against a schema older than its
      # queries; the worker waits for the schema it needs.
      PAINFREE_MIGRATE_ON_STARTUP: "true"
      # Left empty unless `.env` names one, and empty means unset. A deployment
      # that configures an identity provider resolves to `oidc`; one that does
      # not resolves to `basic` and authenticates against accounts it owns.
      # Naming the mode in `.env` overrides both.
      PAINFREE_AUTH_MODE: ${PAINFREE_AUTH_MODE:-}
      # The statement `basic` mode refuses to start without: the `proxy` below
      # terminates TLS and the API is never published, so no credential crosses
      # a plaintext hop. It is on this service and not on the worker, because
      # the worker serves no HTTP and has no proxy in front of it to declare.
      PAINFREE_TLS_TERMINATED_UPSTREAM: "true"
      PAINFREE_OIDC_ISSUER: ${PAINFREE_OIDC_ISSUER:-}
      PAINFREE_OIDC_CLIENT_ID: ${PAINFREE_OIDC_CLIENT_ID:-}
      PAINFREE_OIDC_CLIENT_SECRET_FILE: /run/secrets/painfree_oidc_client_secret
      PAINFREE_OIDC_REDIRECT_URI: ${PAINFREE_OIDC_REDIRECT_URI:-}
      PAINFREE_OIDC_ROLES_CLAIM: ${PAINFREE_OIDC_ROLES_CLAIM:-roles}
      PAINFREE_OIDC_SCOPE_CLAIM: ${PAINFREE_OIDC_SCOPE_CLAIM:-scope}
      # Defaults to the client id when empty. A deployment serving browsers and
      # machines from two clients needs a neutral audience both of them put in
      # `aud`; without this line it could not name one, and every service-account
      # token was refused as `wrong_audience`.
      PAINFREE_OIDC_AUDIENCE: ${PAINFREE_OIDC_AUDIENCE:-}
      # What this deployment's directory calls an administrator, and what it
      # calls everybody else. Empty means the names this service has always
      # accepted; both resolved values are in the startup line.
      PAINFREE_OIDC_ADMIN_ROLE: ${PAINFREE_OIDC_ADMIN_ROLE:-admin,administrator}
      PAINFREE_OIDC_MEMBER_ROLE: ${PAINFREE_OIDC_MEMBER_ROLE:-member,operator,viewer,auditor}
    # No painfree_custody_secret here, and that omission is the boundary.
    secrets:
      - painfree_database_url
      - painfree_oidc_client_secret
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  worker:
    image: ${PAINFREE_IMAGE}
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PAINFREE_ROLE: worker
      PAINFREE_ENVIRONMENT: production
      PAINFREE_DATABASE_URL_FILE: /run/secrets/painfree_database_url
      PAINFREE_KEY_ENCRYPTION_SECRET_FILE: /run/secrets/painfree_custody_secret
      PAINFREE_LOG_LEVEL: ${PAINFREE_LOG_LEVEL:-INFO}
      # The API migrates; a worker that also did would race it for no gain.
      PAINFREE_MIGRATE_ON_STARTUP: "false"
      # The worker serves no HTTP and authenticates nobody. The mode is here
      # only so that its resolved configuration reads the same as the API's in
      # the startup line; it declares no proxy, because it has none.
      PAINFREE_AUTH_MODE: ${PAINFREE_AUTH_MODE:-}
      PAINFREE_OIDC_ISSUER: ${PAINFREE_OIDC_ISSUER:-}
      PAINFREE_OIDC_CLIENT_ID: ${PAINFREE_OIDC_CLIENT_ID:-}
      PAINFREE_OIDC_REDIRECT_URI: ${PAINFREE_OIDC_REDIRECT_URI:-}
      # The worker authenticates nobody, so these decide nothing here. They are
      # passed so its resolved configuration reads identically to the API's in
      # the startup line, which is the only place an operator compares the two.
      PAINFREE_OIDC_ADMIN_ROLE: ${PAINFREE_OIDC_ADMIN_ROLE:-admin,administrator}
      PAINFREE_OIDC_MEMBER_ROLE: ${PAINFREE_OIDC_MEMBER_ROLE:-member,operator,viewer,auditor}
    secrets:
      - painfree_database_url
      - painfree_custody_secret
    # A worker serves no HTTP, so there is no probe that proves the loops are
    # turning. This one proves the process is alive and its database is
    # reachable and at the schema it expects — which is what the restart policy
    # can actually act on. It is a liveness proxy and is documented as one.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; from painfree.config import load_settings; from painfree.db import build_engine, check_ready; sys.exit(0 if check_ready(build_engine(load_settings()))['ready'] else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  proxy:
    # caddy:2.10-alpine, by digest. Terminates TLS and is the only service with
    # a published port — the API is never exposed directly.
    image: docker.io/library/caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PAINFREE_SITE_ADDRESS: ${PAINFREE_SITE_ADDRESS}
      # Read by the Caddyfile, so the site address stays a plain URL and the
      # ports are one decision made in one place.
      PAINFREE_HTTP_PORT: ${PAINFREE_HTTP_PORT:-8080}
      PAINFREE_HTTPS_PORT: ${PAINFREE_HTTPS_PORT:-8443}
    ports:
      # Loopback and a high port by default, because rootless podman may not
      # publish below net.ipv4.ip_unprivileged_port_start, which is 1024 on a
      # stock Ubuntu -- the shipped defaults have to work on the engine this
      # stack was verified with. A host serving a real hostname publishes 80 and
      # 443 instead, which needs root, CAP_NET_BIND_SERVICE or a lower sysctl,
      # and which ACME needs anyway to issue a publicly trusted certificate.
      #
      # Published and internal are the same number on purpose: the proxy listens
      # where PAINFREE_HTTP_PORT and PAINFREE_HTTPS_PORT say, so one pair of
      # values in `.env` moves the whole stack and the site address never has to
      # carry a port.
      - "${PAINFREE_HTTP_BIND:-127.0.0.1:8080}:${PAINFREE_HTTP_PORT:-8080}"
      - "${PAINFREE_HTTPS_BIND:-127.0.0.1:8443}:${PAINFREE_HTTPS_PORT:-8443}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      # The certificates and the local CA's own root key. A bind mount for the
      # same reason the database is one, plus a second: losing it means
      # re-issuing on every restart, and ACME rate limits are real.
      - ./state/caddy-data:/data:z
      - ./state/caddy-config:/config:z
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

secrets:
  painfree_db_password:
    file: ./deploy/secrets/db_password
  # The whole SQLAlchemy URL, because the password is inside it.
  painfree_database_url:
    file: ./deploy/secrets/database_url
  painfree_custody_secret:
    file: ./deploy/secrets/custody_secret
  painfree_oidc_client_secret:
    file: ./deploy/secrets/oidc_client_secret

# No top-level `volumes:` block, deliberately. Every piece of persistent state
# is a bind mount under ./state/, so the deployment directory carries the whole
# deployment and no compose command can delete any of it.
