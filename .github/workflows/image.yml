# Build the deployment image and push it to the GitHub container registry.
#
# A tag publishes a release image; a push to the default branch moves a `main`
# tag, so there is always something current to pull without anyone having to
# cut a release for it. The release tags are immutable by convention and the
# branch tag is the one that moves -- pinning a deployment to `main` is pinning
# it to nothing.
#
# The image records what it is or it does not build. `PAINFREE_VERSION` and
# `GIT_SHA` are required build arguments, so the version comes out of the
# package rather than out of a string typed here, and the commit comes from the
# run itself. An image that cannot say which commit produced it is an image
# nobody can debug six months later.
#
# There is no registry password. The run's own `GITHUB_TOKEN` authenticates the
# push, scoped to `packages: write` and expiring with the job.
#
# Two architectures, and the base image stays pinned by digest: the digest in
# the Dockerfile names an OCI image index that already carries amd64 and arm64,
# so the builder resolves the right manifest out of the pinned index rather
# than following a tag. The dependency lock files resolve on both as well,
# hashes and all, so nothing had to be loosened to get the second architecture.

name: image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/painfree

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to the registry, with the run's own token
      id-token: write        # sign the provenance attestation
      attestations: write    # and record it against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On a tag, the same refusal the package release makes: a tag that
      # disagrees with the version in the package does not become an image
      # either, because the version is baked into the image as a label.
      - name: The tag has to be the version the package claims
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_release_tag.py "${GITHUB_REF_NAME}"

      # Read rather than typed. `painfree/__init__.py` is the one place the
      # version is written and the build argument comes from there.
      - name: Read the version out of the package
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' painfree/__init__.py | head -1)
          test -n "$version" || { echo "no __version__ in painfree/__init__.py" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags and the labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=painfree
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PAINFREE_VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A signed statement, held by GitHub rather than by the image, saying
      # which workflow run and which commit produced this digest. `podman` and
      # `docker` both ignore it; `gh attestation verify` is what reads it, and
      # what an operator asks when they want to know where a tag came from.
      - name: Attest what produced this image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
