[project]
name = "painfree"
# The version lives in `painfree/__init__.py` and is read from there, so there
# is one string to change and nothing that can disagree with it. A duplicate
# here is how a wheel comes to claim a version its own module denies, and the
# release workflow refuses to publish a tag that does not match the module.
dynamic = ["version"]
description = "Self-hosted middleware that accepts JSON payment instructions and submits them to banks over EBICS 3.0"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "reyemb", email = "m3y3r.bastian@gmail.com" }]
keywords = ["ebics", "pain.001", "camt", "iso20022", "banking", "sepa", "payments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
# No `License ::` classifier: the SPDX expression above is the licence
# declaration, and PyPI rejects a distribution that carries both.
dependencies = [
    "lxml>=5.2",
    "cryptography>=42",
    # --- service layer ---
    "fastapi>=0.115",           # the HTTP service
    "uvicorn>=0.30",            # ASGI server the container runs
    "pydantic-settings>=2.4",   # typed settings from the environment, validated at startup
    "sqlalchemy>=2.0",          # one schema and one query layer for SQLite and Postgres both
    "alembic>=1.13",            # migrations that run on both
    "psycopg[binary]>=3.2",     # the production driver; not optional, so it cannot fail only in production
    # Pinned exactly, not floated: this is the code path that decides whether a
    # forged token becomes a payment, and a minor release that widened an
    # algorithm default would do it silently. The attack tests in
    # `tests/test_service_tokens.py` are written against *this service*, so a
    # bump is a change with those tests re-run, not a lockfile change.
    "pyjwt==2.11.0",            # JWT signature and time-claim verification
    # The operator console renders HTML on the server. One small pure-Python
    # package, autoescaping by default, and no build step: the console has no
    # JavaScript and its stylesheet is inlined, so this is the whole of the UI
    # dependency footprint. Form bodies are parsed with `urllib.parse` rather
    # than adding `python-multipart` for a file upload nothing here does.
    "jinja2>=3.1",              # server-rendered templates for the console
    # Argon2id, for the local accounts a deployment with no identity provider
    # authenticates against. The reference implementation's own
    # bindings rather than a pure-Python one: a password hash whose cost is a
    # Python loop is a password hash whose cost is not what the parameters say.
    # `hashlib.scrypt` would have avoided the dependency and is memory-hard too;
    # Argon2id is what the RFC recommends and what the parameters in
    # `painfree/accounts.py` are taken from.
    "argon2-cffi>=23.1",        # Argon2id password hashing
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",              # the ASGI transport behind fastapi.testclient
]

[project.scripts]
painfree = "painfree.__main__:main"

# The distribution is `painfree` and the image is `painfree`; the repository
# says what it is, because a repository name is read by someone deciding
# whether to open it.
[project.urls]
Homepage = "https://github.com/reyemb/painfree-ebics-middleware-python"
Source = "https://github.com/reyemb/painfree-ebics-middleware-python"
Issues = "https://github.com/reyemb/painfree-ebics-middleware-python/issues"
Changelog = "https://github.com/reyemb/painfree-ebics-middleware-python/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "painfree/__init__.py"

# The wheel is the application and nothing else. Tests, the deployment
# directory, the decision log and the build log are all things a reader of this
# repository wants and an installed package has no use for; shipping them makes
# `pip install painfree` deliver a copy of the workshop along with the tool.
[tool.hatch.build.targets.wheel]
packages = ["painfree"]

# The sdist is what a rebuild needs: the package, the build configuration, the
# licence files a redistributor must keep, and the test suite, so that anyone
# who has the source distribution can check it rather than take the wheel's
# word for it. An explicit list rather than a set of exclusions -- a new
# top-level directory in this repository joins the sdist only by being named.
[tool.hatch.build.targets.sdist]
include = [
    "/painfree",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
    "/hatch_build.py",
]
exclude = ["**/__pycache__", "**/*.pyc"]

# `.gitignore` is force-included in every sdist by the backend, and a
# force-include ignores `exclude`. See the module docstring for why it is
# dropped and why the hook is scoped to this target rather than to the build.
[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
